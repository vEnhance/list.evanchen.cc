[project]
name = "list-evanchen-cc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Evan Chen", email = "evan@evanchen.cc" }
]
license = "MIT"
urls = { repository = "https://github.com/vEnhance/list.evanchen.cc" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.0.8,<6.1",
    "django-allauth[socialaccount]>=65.19.1",
    "django-discordo>=1.2.0",
    "django-extensions>=4.1",
    "django-stubs>=6.1.0",
    "python-dotenv>=1.2.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.djlint]
profile = "django"

[tool.ruff.lint.per-file-ignores]
# RUF012: `dependencies` and `operations` are written by `makemigrations`, so
# any ClassVar annotation we add here would be lost on the next regeneration.
"*/migrations/*.py" = ["RUF012"]

[project.optional-dependencies]
prod = [
    "mysqlclient>=2.2.8",
]

[dependency-groups]
dev = [
    "prek>=0.4.14",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "werkzeug>=3.1.8",
]
